<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snoofé</title>
<link rel="stylesheet" href="login.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@400;500;600&display=swap" rel="stylesheet">

</head>

<body>
  <!-- Header -->
   
   <header>
        <div class="logo">Snoofé</div>
    </header>
 
  <!-- Login Section -->
  <main class="login-wrapper">
    <h1 class="page-title">Welcome <span class="highlight">Back</span></h1>
    <p class="page-subtitle">Log in to order your favorite brew and pick up a good read.</p>
 
    <div class="login-card">
 
      <div class="login-form-panel">
        <h2>LOG IN</h2>
 
        <form id="loginForm">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email address" required>
 
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
 
          <div class="form-row">
            <label class="remember">
              <input type="checkbox" name="remember">
              Remember me
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
 
          <button type="submit" class="btn-login">Log In</button>
        </form>
 
        <p class="signup-prompt">Don't have an account? <a href="#">Sign up</a></p>
      </div>
 
      <div class="login-side-panel">
        <div class="avatar">
            <img src="image/snoopy_avatar.png" alt="Snoopy profile avatar">
        </div>
        <h3>New here?</h3>
        <p>Join Snoofé and get free books to go with your brew.</p>
        <a href="#" class="btn-outline">Create Account</a>
      </div>
 
    </div>
  </main>

</body>
</html>
